aid: smithrx
name: SmithRx
description: 'SmithRx (legal entity Smith Health, Inc.) is a pass-through pharmacy
  benefit manager (PBM) for self-insured employers, founded by Jake Frenz. It operates
  its own in-house claims adjudication platform and a "Drug Pathways Engine" that
  routes every pharmacy claim to the lowest net cost pathway across drug selection,
  source and pricing. SmithRx sells through brokers, TPAs and benefits consultants,
  serves members through a member portal, and serves brokers and TPAs through a
  partner portal. It is URAC-accredited for Pharmacy Benefit Management. SmithRx
  publishes no public developer portal, API documentation or machine-readable API
  contract; its platform marketing describes "secure APIs" used to connect a customer
  plan to existing vendors, but that surface is private and partner-gated.'
